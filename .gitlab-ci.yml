# Use Node.js 20 for your Next.js project
image: node:20

# Define variables
variables:
  VM_DEST_DIR: "/root" # Where tarball is sent and extracted
  VM_HOST: "$VM_HOST"

# Cache node_modules to speed up builds
cache:
  paths:
    - node_modules/

stages:
  - build
  - deploy

build:
  stage: build
  script:
    # Create .env file for build
    - |
      echo "MONGODB_URI=$MONGODB_URI" > .env
      echo "NEXT_PUBLIC_RECAPTCHA_SITE_KEY=$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" >> .env
      echo "RECAPTCHA_SECRET_KEY=$RECAPTCHA_SECRET_KEY" >> .env
      # Add other variables if needed, e.g.:
      # echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env
    - npm ci --legacy-peer-deps
    - npm run build
    - tar -czvf hiretrack-v1.tar.gz .
  artifacts:
    paths:
      - hiretrack-v1.tar.gz
  only:
    - main-backup

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache sshpass openssh-client
  script:
    # Transfer tarball to VM
    - |
      echo "Transferring hiretrack-v1.tar.gz to VM..."
      sshpass -p "$VM_PASSWORD" scp -o StrictHostKeyChecking=no hiretrack-v1.tar.gz root@$VM_HOST:$VM_DEST_DIR
    # Extract and deploy on VM
    - |
      sshpass -p "$VM_PASSWORD" ssh -o StrictHostKeyChecking=no root@$VM_HOST << 'EOF'
        cd $VM_DEST_DIR
        rm -rf hiretrack-latest
        mkdir -p hiretrack-latest
        tar -xzvf hiretrack-v1.tar.gz -C hiretrack-latest
        cd hiretrack-latest
        cp /root/.env.production .env
        pm2 restart hiretrack || pm2 start npm --name "hiretrack" -- start
      EOF
  environment: production
  only:
    - main-backup