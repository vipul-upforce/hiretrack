<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
  <h2>{{hrNotificationTitle}}</h2>
  <p>{{candidateName}} has applied for a position at <b>{{orgName}}</b>.</p>
  <p>Application details:</p>
  <div>
    <strong>Job Title:</strong> {{jobName}}<br>
    <strong>Candidate Name:</strong> {{candidateName}}<br>
    <strong>Candidate Email:</strong> {{email}}<br>
    <strong>Status:</strong> {{status}}<br>
    <strong>Application Date:</strong> {{applicationDate}}
  </div>
</div>
