components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT token stored in HTTP-only cookie

  schemas:
    # ========== USER SCHEMAS ==========
    UserProfile:
      type: object
      properties:
        _id:
          type: string
          example: "64f1a2b3c4d5e6f7g8h9i0j1"
        name:
          type: string
          example: "John Smith"
        email:
          type: string
          format: email
          example: "john@company.com"
        role:
          type: string
          enum: [admin, hr, interviewer, candidate]
          example: "hr"
        organizationId:
          type: string
          example: "64f1a2b3c4d5e6f7g8h9i0j1"
        organizationInfo:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
              example: "TechCorp Solutions"
            customFields:
              type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    User:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          properties:
            isDeleted:
              type: boolean
              default: false
            resetToken:
              type: string
            resetTokenExpiry:
              type: string
              format: date-time
            otp:
              type: integer
              description: Two-factor authentication OTP
            otpExpires:
              type: string
              format: date-time

    # ========== ORGANIZATION SCHEMAS ==========
    OrganizationSummary:
      type: object
      properties:
        _id:
          type: string
          example: "64f1a2b3c4d5e6f7g8h9i0j1"
        name:
          type: string
          example: "TechCorp Solutions"
        orgId:
          type: string
          example: "64f1a2b3c4d5e6f7g8h9i0j1"

    OrganizationSettings:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        adminId:
          type: string
        lanes:
          type: array
          items:
            type: string
          example: ["applied", "screening", "shortlisted", "processing", "accepted", "rejected"]
        openJobCards:
          type: array
          items:
            type: string
          description: "Job ordering configuration"
        customFields:
          $ref: '#/components/schemas/CustomFields'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        multipleOrg:
          type: boolean
          description: "Whether multiple organizations are allowed"

    Tag:
      type: object
      properties:
        title:
          type: string
          example: "High Priority"
        color:
          type: string
          example: "#FF5733"
          description: "Hex color code for tag display"

    # ========== JOB SCHEMAS ==========
    JobInput:
      type: object
      required: [title, description, experience]
      properties:
        title:
          type: string
          example: "Senior Software Engineer"
          description: "Job position title"
        description:
          type: string
          example: "We are looking for an experienced software engineer..."
          description: "Detailed job description"
        skills:
          type: array
          items:
            type: string
          example: ["JavaScript", "React", "Node.js", "MongoDB"]
          description: "Required skills for the position"
        experience:
          type: integer
          minimum: 0
          example: 5
          description: "Required years of experience"
        links:
          type: array
          items:
            type: string
            format: uri
          example: ["https://company.com/benefits"]
          description: "Additional information links"
        salary:
          type: object
          properties:
            min:
              type: number
              example: 80000
            max:
              type: number
              example: 120000
            inText:
              type: string
              example: "Competitive salary based on experience"
            isPrivate:
              type: boolean
              default: false
              description: "Whether salary range is private"
        status:
          type: string
          enum: [open, closed, draft]
          default: open
          description: "Job posting status"
        isPublished:
          type: boolean
          default: false
          description: "Whether job is published on public portal"

    Job:
      allOf:
        - $ref: '#/components/schemas/JobInput'
        - type: object
          properties:
            _id:
              type: string
              example: "64f1a2b3c4d5e6f7g8h9i0j1"
            organizationId:
              type: string
              example: "64f1a2b3c4d5e6f7g8h9i0j1"
            attachments:
              $ref: '#/components/schemas/FileAttachments'
            tracking:
              type: object
              properties:
                createdAt:
                  type: string
                  format: date-time
                openedAt:
                  type: string
                  format: date-time
                closedAt:
                  type: string
                  format: date-time
            customFields:
              type: object
              description: "Organization-specific custom fields"

    PublicJob:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        experience:
          type: integer
        salary:
          type: object
          properties:
            inText:
              type: string
            isPrivate:
              type: boolean
        links:
          type: array
          items:
            type: string
        organizationName:
          type: string
          description: "Public organization name"

    # ========== CANDIDATE SCHEMAS ==========
    CandidateInput:
      type: object
      required: [name, location, experience, skills]
      properties:
        name:
          type: string
          example: "Jane Doe"
          description: "Candidate full name"
        location:
          type: string
          example: "San Francisco, CA"
          description: "Candidate location"
        experience:
          type: number
          minimum: 0
          example: 3
          description: "Years of experience"
        skills:
          type: array
          items:
            type: string
          example: ["Python", "Django", "PostgreSQL"]
          description: "Candidate skills"
        expectedCTC:
          type: number
          example: 100000
          description: "Expected salary"
        currentCTC:
          type: number
          example: 85000
          description: "Current salary"
        noticePeriod:
          type: number
          example: 30
          description: "Notice period in days"
        phoneNumber:
          type: string
          example: "+1-555-123-4567"
          description: "Contact phone number"
        email:
          type: string
          format: email
          example: "jane@email.com"
          description: "Contact email address"
        resume:
          $ref: '#/components/schemas/FileAttachment'
        customFields:
          type: object
          description: "Organization-specific custom field data"

    Candidate:
      allOf:
        - $ref: '#/components/schemas/CandidateInput'
        - type: object
          properties:
            _id:
              type: string
              example: "64f1a2b3c4d5e6f7g8h9i0j1"
            jobId:
              type: string
              example: "64f1a2b3c4d5e6f7g8h9i0j1"
              description: "Associated job ID"
            organizationId:
              type: string
              example: "64f1a2b3c4d5e6f7g8h9i0j1"
            status:
              type: string
              example: "screening"
              description: "Current workflow stage"
            remarks:
              type: array
              items:
                type: object
                properties:
                  _id:
                    type: string
                  description:
                    type: string
                    example: "Great communication skills during phone screen"
                  date:
                    type: string
                    format: date-time
                  rating:
                    type: number
                    minimum: 0
                    maximum: 5
                    example: 4
                  userId:
                    type: string
                    description: "ID of user who added remark"
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/FileAttachment'
            assignment:
              type: object
              properties:
                interviewerId:
                  type: string
                  description: "Assigned interviewer ID"
                assignedAt:
                  type: string
                  format: date-time
                time:
                  type: string
                  format: date-time
                  description: "Scheduled interview time"
            followUp:
              type: object
              properties:
                note:
                  type: string
                date:
                  type: string
                  format: date-time
                userId:
                  type: string
            tags:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
            tracking:
              type: object
              properties:
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
            isDeleted:
              type: boolean
              default: false

    # ========== FILE SCHEMAS ==========
    FileAttachment:
      type: object
      properties:
        id:
          type: string
          example: "file_unique_id_123"
          description: "Unique file identifier"
        name:
          type: string
          example: "resume.pdf"
          description: "Original filename"
        url:
          type: string
          format: uri
          example: "https://storage.com/files/resume.pdf"
          description: "File access URL"
        type:
          type: string
          example: "application/pdf"
          description: "MIME type"
        size:
          type: number
          example: 2048576
          description: "File size in bytes"

    FileAttachments:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileAttachment'
          description: "Document attachments"
        images:
          type: array
          items:
            $ref: '#/components/schemas/FileAttachment'
          description: "Image attachments"

    # ========== CUSTOM FIELDS SCHEMAS ==========
    CustomFields:
      type: object
      description: "Dynamic form fields configuration"
      additionalProperties:
        type: object
        properties:
          formName:
            type: string
            example: "Job Application Form"
          fields:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                label:
                  type: string
                  example: "Portfolio URL"
                type:
                  type: string
                  enum: [text, email, number, select, multiselect, textarea, file, date]
                  example: "text"
                required:
                  type: boolean
                  default: false
                options:
                  type: array
                  items:
                    type: string
                  description: "Options for select/multiselect fields"
                validation:
                  type: object
                  properties:
                    minLength:
                      type: integer
                    maxLength:
                      type: integer
                    pattern:
                      type: string
                      description: "Regex validation pattern"

    # ========== HISTORY SCHEMAS ==========
    HistoryEntry:
      type: object
      properties:
        _id:
          type: string
        candidateId:
          type: string
        jobId:
          type: string
        history:
          type: array
          items:
            type: object
            properties:
              dateTime:
                type: string
                format: date-time
              title:
                type: string
                example: "Status changed to Shortlisted"
              previousValue:
                type: string
              currentValue:
                type: string
              remark:
                type: object
                properties:
                  description:
                    type: string
                  rating:
                    type: number
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileAttachment'
              assignmentBy:
                type: string
                description: "User ID who made the change"
              previousInterviewer:
                type: string
              currentInterviewer:
                type: string

    # ========== ERROR SCHEMAS ==========
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: "Error message describing what went wrong"
          example: "Invalid credentials"
        message:
          type: string
          description: "Additional error details"
        code:
          type: string
          description: "Error code for programmatic handling"

    # ========== SETTINGS SCHEMAS ==========
    PortalSettings:
      type: object
      properties:
        portalLogo:
          $ref: '#/components/schemas/FileAttachment'
        portalName:
          type: string
          example: "TechCorp Careers"
        portalHeader:
          $ref: '#/components/schemas/FileAttachment'
        portalFooter:
          $ref: '#/components/schemas/FileAttachment'
        fileStorage:
          type: object
          properties:
            storageType:
              type: string
              enum: [local, cloudinary, s3]
            cloudinaryCloudName:
              type: string
            cloudinaryApiKey:
              type: string
            cloudinaryApiSecret:
              type: string
            awsRegion:
              type: string
            awsAccessKeyId:
              type: string
            awsSecretAccessKey:
              type: string
            awsBucketName:
              type: string

    EmailSettings:
      type: object
      properties:
        mailProvider:
          type: string
          enum: [smtp, resend, brevo]
        smtp_host:
          type: string
        smtp_port:
          type: string
        smtp_user:
          type: string
        smtp_password:
          type: string
        smtp_from:
          type: string
        resend_api_key:
          type: string
        resend_from:
          type: string
        resend_reply_to:
          type: string
        brevo_api_key:
          type: string
        brevo_from:
          type: string
        brevo_reply_to:
          type: string

    AISettings:
      type: object
      properties:
        gemini_key:
          type: string
          description: "Google Gemini AI API key"
        enable:
          type: boolean
          description: "Whether AI processing is enabled"

