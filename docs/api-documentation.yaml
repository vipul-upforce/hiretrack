openapi: 3.0.3
info:
  title: HireTrack API Documentation
  description: |
    Comprehensive API documentation for HireTrack - AI-powered hiring management platform.
    
    **Authentication**: Most endpoints require JWT token authentication via cookies.
    **Base URL**: http://localhost:3000/api
    
    **Key Features**:
    - Multi-tenant organization support
    - Role-based access control (Admin, HR, Interviewer, Candidate)
    - AI-powered resume analysis with Google Gemini
    - Real-time updates via Server-Sent Events (SSE)
    - File storage support (Local, Cloudinary, AWS S3)
    - Email notifications (SMTP, Resend, Brevo)
    - Two-factor authentication
    
    **Usage Contexts**:
    - **Dashboard**: Internal hiring management interface
    - **Portal**: Public job application interface
    - **Mobile**: Responsive candidate application
    - **API Integrations**: Third-party system integrations
  version: 1.0.0
  contact:
    name: HireTrack Support
    email: support@hiretrack.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://your-domain.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Organizations
    description: Multi-tenant organization management
  - name: Users
    description: User account management and role administration
  - name: Jobs
    description: Job posting creation, management, and publishing
  - name: Candidates
    description: Candidate profile management and application processing
  - name: Assignments
    description: Interview assignments and candidate-interviewer mapping
  - name: Lanes
    description: Kanban workflow stage management
  - name: History
    description: Audit trail and candidate interaction history
  - name: Settings
    description: System configuration and organization settings
  - name: Files
    description: File upload, storage, and management
  - name: Email
    description: Email notifications and template management
  - name: Analytics
    description: Real-time updates and monitoring
  - name: AI
    description: AI-powered resume processing and candidate evaluation

security:
  - cookieAuth: []

paths:
  # ========== AUTHENTICATION ENDPOINTS ==========
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: |
        **Purpose**: Authenticate users and establish session
        **Used By**: Login page, mobile app authentication
        **Where**: `/auth/login` page, organization-specific login portals
        **How**: Users enter email/password, system validates credentials and creates JWT session
        
        **Business Logic**:
        - Validates user credentials against database
        - Supports multi-organization login (if multiple orgs exist)
        - Creates encrypted JWT token with user data
        - Sets secure HTTP-only cookie for session management
        - Returns user role and organization information
        
        **Security Features**:
        - Password hashing with bcrypt
        - JWT token encryption
        - Rate limiting protection
        - Organization-specific user isolation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "john@company.com"
                  description: User's email address
                password:
                  type: string
                  format: password
                  example: "securePassword123"
                  description: User's password
                orgId:
                  type: string
                  example: "64f1a2b3c4d5e6f7g8h9i0j1"
                  description: Organization ID (required for multi-org setups)
            examples:
              single_org_login:
                summary: Single organization login
                value:
                  email: "admin@company.com"
                  password: "password123"
              multi_org_login:
                summary: Multi-organization login
                value:
                  email: "hr@company.com"
                  password: "password123"
                  orgId: "64f1a2b3c4d5e6f7g8h9i0j1"
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: JWT session token
              schema:
                type: string
                example: "token=encrypted_jwt_token; HttpOnly; Secure; SameSite=Strict"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/UserProfile'
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSummary'
                    description: Available organizations (for multi-org users)
        '400':
          description: Invalid request or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_credentials:
                  summary: Missing email or password
                  value:
                    error: "Email and password are required"
                invalid_org:
                  summary: Invalid organization ID
                  value:
                    error: "Organization not found"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_credentials:
                  summary: Wrong email or password
                  value:
                    error: "Invalid credentials"
                account_disabled:
                  summary: Account disabled
                  value:
                    error: "Account has been disabled"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/signup:
    post:
      tags: [Authentication]
      summary: Create new user account
      description: |
        **Purpose**: Register new users within an organization
        **Used By**: Admin dashboard, HR management interface
        **Where**: User management pages, organization setup
        **How**: Admins create accounts for HR, interviewers; HR creates interviewer accounts
        
        **Business Logic**:
        - Creates user accounts with role-based permissions
        - Validates email uniqueness within organization
        - Sets up default workflow lanes for new organizations
        - Sends welcome email to new users
        - Enforces organization-specific user limits
        
        **Role Permissions**:
        - Admin: Can create any role
        - HR: Can create Interviewer roles only
        - Others: Cannot create accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role, organizationId]
              properties:
                name:
                  type: string
                  example: "John Smith"
                  description: Full name of the user
                email:
                  type: string
                  format: email
                  example: "john@company.com"
                  description: Unique email address
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "securePassword123"
                  description: User password (will be hashed)
                role:
                  type: string
                  enum: [admin, hr, interviewer, candidate]
                  example: "hr"
                  description: User role defining permissions
                organizationId:
                  type: string
                  example: "64f1a2b3c4d5e6f7g8h9i0j1"
                  description: Organization the user belongs to
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User created successfully"
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
        '401':
          description: Unauthorized to create users
        '409':
          description: Email already exists

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: |
        **Purpose**: Allow users to reset forgotten passwords
        **Used By**: Login page, password recovery flow
        **Where**: Forgot password link on login pages
        **How**: Users enter email, system sends reset link via email
        
        **Business Logic**:
        - Generates secure reset token with expiration
        - Sends password reset email to user
        - Supports both regular users and candidate accounts
        - Token expires after 1 hour for security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@company.com"
                organizationId:
                  type: string
                  example: "64f1a2b3c4d5e6f7g8h9i0j1"
                  description: Required for organization-specific users
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset email sent"

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with token
      description: |
        **Purpose**: Complete password reset process
        **Used By**: Password reset email links
        **Where**: Password reset confirmation pages
        **How**: Users click email link, enter new password, system updates account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  example: "secure_reset_token_123"
                  description: Reset token from email
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "newSecurePassword123"
      responses:
        '200':
          description: Password reset successful

  /auth/2fa/send-otp:
    post:
      tags: [Authentication]
      summary: Send two-factor authentication OTP
      description: |
        **Purpose**: Send OTP for two-factor authentication
        **Used By**: Login flow when 2FA is enabled
        **Where**: 2FA verification pages
        **How**: System sends 6-digit OTP to user's email after initial login
        
        **Business Logic**:
        - Generates 6-digit random OTP
        - Stores OTP with 5-minute expiration
        - Sends OTP via configured email provider
        - Rate limited to prevent abuse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, organizationId]
              properties:
                email:
                  type: string
                  format: email
                organizationId:
                  type: string
      responses:
        '200':
          description: OTP sent successfully

  /auth/2fa/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify two-factor authentication OTP
      description: |
        **Purpose**: Complete 2FA verification process
        **Used By**: 2FA verification forms
        **Where**: OTP input pages during login
        **How**: Users enter received OTP, system validates and completes authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: "123456"
      responses:
        '200':
          description: OTP verified, login complete

  # ========== ORGANIZATION ENDPOINTS ==========
  /orgs:
    get:
      tags: [Organizations]
      summary: Get public organization list
      description: |
        **Purpose**: Provide anonymous access to organization portal names for login page
        **Used By**: Login page, organization selection dialogs
        **Where**: Public login interfaces, organization discovery
        **How**: Anonymous users can see available organizations for login selection
        
        **Security**: Only exposes minimal public data (ID and portal name)
        **No Authentication Required**: This endpoint is publicly accessible
      responses:
        '200':
          description: List of available organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  portals:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "64f1a2b3c4d5e6f7g8h9i0j1"
                        name:
                          type: string
                          example: "TechCorp Solutions"
              example:
                portals:
                  - id: "64f1a2b3c4d5e6f7g8h9i0j1"
                    name: "TechCorp Solutions"
                  - id: "64f1a2b3c4d5e6f7g8h9i0j2"
                    name: "StartupXYZ"

  /organization:
    get:
      tags: [Organizations]
      summary: Get organization settings and multi-org status
      description: |
        **Purpose**: Check if multiple organizations are allowed and get org data
        **Used By**: Dashboard layouts, organization management pages
        **Where**: Admin settings, organization configuration
        **How**: Authenticated users check multi-org permissions and settings
        
        **Business Logic**:
        - Returns organization-specific settings
        - Indicates if user can create multiple organizations
        - Provides organization metadata for UI decisions
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Organization settings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  allow:
                    type: boolean
                    description: Whether multiple organizations are allowed
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSettings'

    post:
      tags: [Organizations]
      summary: Create new organization
      description: |
        **Purpose**: Create new organization with admin user
        **Used By**: Organization registration pages, admin setup
        **Where**: Initial setup, multi-org expansion
        **How**: Creates organization structure and admin account atomically
        
        **Business Logic**:
        - Creates organization and admin user in single transaction
        - Sets up default workflow lanes and settings
        - Creates organization-specific file storage directory
        - Initializes default custom fields and configurations
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, adminData]
              properties:
                name:
                  type: string
                  example: "TechCorp Solutions"
                adminData:
                  type: object
                  required: [name, email, password]
                  properties:
                    name:
                      type: string
                      example: "Admin User"
                    email:
                      type: string
                      format: email
                      example: "admin@techcorp.com"
                    password:
                      type: string
                      format: password
      responses:
        '201':
          description: Organization created successfully
        '400':
          description: Invalid data or creation failed
        '401':
          description: Not authorized to create organizations

    put:
      tags: [Organizations]
      summary: Update organization workflow lanes
      description: |
        **Purpose**: Modify kanban workflow stages for hiring process
        **Used By**: Admin settings, workflow configuration
        **Where**: Organization settings pages
        **How**: Admins customize hiring pipeline stages
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orgId:
                  type: string
                lanes:
                  type: array
                  items:
                    type: string
                  example: ["applied", "screening", "interview", "offer", "hired", "rejected"]
      responses:
        '200':
          description: Organization workflow lanes updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Workflow lanes updated successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organization/cf:
    get:
      tags: [Organizations]
      summary: Get organization custom fields (anonymous)
      description: |
        **Purpose**: Retrieve custom form fields for public job applications
        **Used By**: Job application forms, candidate portals
        **Where**: Public job posting pages, application forms
        **How**: Anonymous candidates see required custom fields for applications
        
        **No Authentication Required**: Public access for job applications
      responses:
        '200':
          description: Custom fields configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFields'

  /organization/cf/{orgName}:
    get:
      tags: [Organizations]
      summary: Get custom fields by organization name
      description: |
        **Purpose**: Get custom fields for specific organization by name
        **Used By**: Organization-specific job application portals
        **Where**: Branded career portals (e.g., /company-name/apply-jobs)
        **How**: Public access to organization's custom application fields
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
          example: "techcorp-solutions"
      responses:
        '200':
          description: Organization-specific custom fields

  /organization/cs:
    post:
      tags: [Organizations]
      summary: Update organization custom fields
      description: |
        **Purpose**: Admin interface to modify custom form fields
        **Used By**: Admin dashboard, form builder interface
        **Where**: Organization settings, custom fields management
        **How**: Admins create/edit dynamic form fields for applications
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orgId:
                  type: string
                customFields:
                  $ref: '#/components/schemas/CustomFields'
      responses:
        '200':
          description: Custom fields updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Custom fields updated successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organization/cs/{org}:
    get:
      tags: [Organizations]
      summary: Get custom fields by org ID
      description: |
        **Purpose**: Retrieve custom fields using organization ID
        **Used By**: Internal applications, authenticated forms
        **Where**: Dashboard forms, internal candidate management
        **How**: Authenticated users access organization's custom fields
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Custom fields retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFields'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organization/tags:
    get:
      tags: [Organizations]
      summary: Get organization tags
      description: |
        **Purpose**: Retrieve available tags for candidate categorization
        **Used By**: Candidate tagging interfaces, filter dropdowns
        **Where**: Candidate management pages, search filters
        **How**: HR users access available tags for candidate organization
      security:
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Available tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

    post:
      tags: [Organizations]
      summary: Create or update organization tags
      description: |
        **Purpose**: Manage tags for candidate categorization
        **Used By**: Admin/HR interfaces for tag management
        **Where**: Organization settings, tag management pages
        **How**: Admins create/modify tags for candidate organization
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Tags created/updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Tags updated successfully"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ========== USER ENDPOINTS ==========
  /users:
    get:
      tags: [Users]
      summary: Get organization users
      description: |
        **Purpose**: List all users within an organization
        **Used By**: User management dashboard, team overview
        **Where**: Admin/HR user management pages
        **How**: Display organization team members with roles and status
        
        **Role Access**:
        - Admin: Can see all users
        - HR: Can see HR and Interviewer roles
        - Others: Limited access
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of organization users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get specific user details
      description: |
        **Purpose**: Retrieve detailed information about a specific user
        **Used By**: User profile pages, edit user forms
        **Where**: User management interfaces
        **How**: Display/edit individual user information
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Users]
      summary: Update user information
      description: |
        **Purpose**: Modify user account details and permissions
        **Used By**: User edit forms, profile management
        **Where**: User management pages, profile settings
        **How**: Admins/HR update user information and roles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User information updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User updated successfully"
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Users]
      summary: Delete user account
      description: |
        **Purpose**: Remove user from organization (soft delete)
        **Used By**: User management interfaces
        **Where**: Admin user management pages
        **How**: Mark user as deleted while preserving data integrity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Resource deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Resource deleted successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/interviewers:
    get:
      tags: [Users]
      summary: Get interviewers list
      description: |
        **Purpose**: Get users with interviewer role for assignment dropdowns
        **Used By**: Candidate assignment forms, interview scheduling
        **Where**: Candidate management pages, assignment dialogs
        **How**: HR selects interviewers for candidate assignments
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of interviewers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
                    email:
                      type: string

  # ========== JOB ENDPOINTS ==========
  /jobs:
    get:
      tags: [Jobs]
      summary: Get organization jobs
      description: |
        **Purpose**: Retrieve all jobs for an organization with candidate counts
        **Used By**: Jobs dashboard, job management interface
        **Where**: Main jobs page, job overview screens
        **How**: Display job listings with application counts and status
        
        **Data Includes**:
        - Job details and descriptions
        - Candidate application counts
        - Job status (open/closed/draft)
        - Custom ordering based on organization preferences
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of jobs with candidate counts
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Job'
                    - type: object
                      properties:
                        candidateCount:
                          type: integer
                          description: Number of candidates who applied

    post:
      tags: [Jobs]
      summary: Create new job posting
      description: |
        **Purpose**: Create new job posting with attachments and custom fields
        **Used By**: Job creation forms, HR job posting interface
        **Where**: Job creation pages, HR dashboard
        **How**: HR/Admin creates job with details, requirements, and attachments
        
        **Business Logic**:
        - Handles file attachments (images and documents)
        - Processes custom fields specific to organization
        - Sets default status and tracking information
        - Validates required fields and permissions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JobInput'
                - type: object
                  properties:
                    attachments:
